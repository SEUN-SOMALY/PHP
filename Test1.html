<!DOCTYPE html>
<html>
    <head>
        <title>Form In HTML</title>
    </head>
    <body>
        <canter>
            <h1>Form in HTML </h1>
        </canter>
        <form>
            <h1>1. Text Input </h1>
            <label for="">Username : </label>
            <input type="text" id="username" placeholder="Enter Your name">
            <h1>2. Email Input</h1> 
            <label for="email"> id</label>
            <input type="email"id="email">
            <h1>3. Password Input</h1>
            <label for="pass">Password</label>
            <input type="password"id="pass">
            <h1>4. Single Option (Radio Input)</h1>
            <input type="radio"name="r" id="a">
            <label for="a">1. true</label>
            <input type="radio"name="r"id=b>
            <label for="b">2. false</label>
            <h1>5. Multiple Option (checkbox)</h1>
            <input type="checkbox"id="c">
            <label for="c">1. Item</label>
            <input type="checkbox"id="d">
            <label for="d">2. Item</label>
            <h1>6. select drop down</h1>
            <label for="vehicle">Favorite Vichicle : </label>
            <select name="" id="vehicle">
            <select value="" id="">Bikecycle</select>
            <select value="" id="">Motorcycle</select>
            <select value="" id="">car</select>
            </select>
            <h1>7. File Input </h1>
            <label for="profile">Your Profile : </label>
            <input type="file"id="profile">
            <h1>8. Text Area</h1>
            <textarea placeholder="Message"name=""id=""></textarea>
            <h1>9. Date Input</h1>
            <label for="date">Date : </label>
            <input type="date"name=""id="date">
            <h1>10. Time</h1>
            <label for="time"Time : </label>
            <input type="time"name=""id="time">
            <h1>11. Date Time Input</h1>
            <label for="datetime">Datetime : </label>
            <input type="datetime-local"name=""id="datetime">
            <b></b>
            <input type="submit" value="submit">
            <input type="reset" value="Cencel">
            <input type="button" value="Button">
        </form>
    </body>
</html>
